name: Sync from snaphost.ai

# This repository mirrors what the SnapHost application serves: the Claude Code plugin archive and
# the registry server.json. The application is the source of truth; this workflow only pulls,
# commits what changed, and publishes a new registry version when the version changed.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

env:
  ORIGIN: https://snaphost.ai

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the plugin archive and server.json
        run: |
          set -euo pipefail
          curl -fsSL "$ORIGIN/developers/skills/snaphost-plugin.zip" -o /tmp/plugin.zip
          curl -fsSL "$ORIGIN/developers/mcp/server.json" -o /tmp/server.json
          rm -rf /tmp/plugin && mkdir -p /tmp/plugin
          unzip -q /tmp/plugin.zip -d /tmp/plugin
          test -f /tmp/plugin/snaphost/.claude-plugin/marketplace.json || { echo "archive lacks .claude-plugin/marketplace.json"; exit 1; }
          test -f /tmp/plugin/snaphost/plugins/snaphost/.mcp.json || { echo "archive lacks plugins/snaphost/.mcp.json"; exit 1; }
          python3 -c 'import json; d=json.load(open("/tmp/server.json")); assert d["name"]=="ai.snaphost/snaphost", d["name"]; print("server.json version", d["version"])'

      - name: Replace the tracked, generated paths
        run: |
          set -euo pipefail
          rm -rf .claude-plugin plugins
          cp -R /tmp/plugin/snaphost/.claude-plugin .claude-plugin
          cp -R /tmp/plugin/snaphost/plugins plugins
          python3 -c 'import json; json.dump(json.load(open("/tmp/server.json")), open("server.json","w"), indent=2); open("server.json","a").write("\n")'

      - name: Commit if anything changed
        id: commit
        run: |
          set -euo pipefail
          git add -A .claude-plugin plugins server.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "unchanged"
            exit 0
          fi
          VERSION=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          git -c user.name="snaphost-sync" -c user.email="hello@snaphost.ai" commit -m "Sync plugin and server.json ($VERSION)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether the registry needs this version
        id: registry
        run: |
          set -euo pipefail
          LOCAL=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          LATEST=$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/ai.snaphost%2Fsnaphost/versions/latest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["server"]["version"])' || echo "none")
          echo "local $LOCAL, registry $LATEST"
          if [ "$LOCAL" != "$LATEST" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to the official MCP registry
        if: steps.registry.outputs.publish == 'true'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCP_REGISTRY_PRIVATE_KEY" || { echo "MCP_REGISTRY_PRIVATE_KEY secret is not set"; exit 1; }
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain snaphost.ai --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
